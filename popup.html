<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Abnormal Requests</title>
  <style>
    body {
      width: 500px;
      background-color: #eee;
    }

    .header {
      text-align: center;
    }

    #container .item {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: space-between;
    }

    #container .item .col {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .item .col1 {
      width: 49.5%;
    }

    .item .col2 {
      width: 49.5%;
      margin-left: 5px;
    }

    #container .item .col input {
      border-radius: 3px;
      box-sizing: border-box;
      border: none;
      outline: none;
      width: 100%;
      padding: 5px;
    }

    #container .item:nth-child(n + 1) {
      margin-bottom: 5px;
    }
  </style>
</head>

<body>
  <h3 class="header"></h3>
  <div id="container"></div>
  <script src="popup.js"></script>
</body>

</html>
